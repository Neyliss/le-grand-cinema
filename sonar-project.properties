# Analyse de la qualité du code par SonarQube Cloud (sonarcloud.io), lancée par GitHub Actions
# (.github/workflows/ci.yml) à chaque envoi sur main ou develop et à chaque pull request.
# Mise en place pas à pas : docs/guide-sonarcloud.md
sonar.projectKey=Neyliss_le-grand-cinema
sonar.organization=neyliss
sonar.projectName=Le Grand Cinéma

# Code analysé : tout le projet, sauf ce qui est généré ou n'est pas du code
sonar.sources=.
sonar.exclusions=**/migrations/**,**/tests/**,outils_de_test/**,docs/**,media/**,staticfiles/**,locale/**,static/img/**
# Les tests sont reconnus comme tels (ils ne comptent pas dans les défauts du code)
sonar.tests=.
sonar.test.inclusions=**/tests/**,outils_de_test/**

# Python et couverture des tests (rapport produit par « coverage xml »)
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# Fichiers sans tests Python : démarrage du serveur et JavaScript (testé par les parcours en navigateur)
sonar.coverage.exclusions=manage.py,grandcinema/asgi.py,grandcinema/wsgi.py,static/js/**
